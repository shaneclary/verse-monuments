[project]
name = "kodex"
version = "1.0.0"
description = "KODEX — Spine Surgery (ADR) Cost-vs-Quality Decision Matrix (offline decision-support aggregator)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2",
    "pandas>=2",
    "pyyaml>=6",
    "weasyprint>=60",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
kodex = "kodex.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools]
packages = ["kodex", "kodex.connectors"]
